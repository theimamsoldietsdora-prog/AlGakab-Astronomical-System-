<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>نظام المهندس آل عكاب الفلكي - التقويم القمري المتسلسل</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/moon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #07090e; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: rgba(13, 17, 23, 0.9); border: 1px solid rgba(48, 54, 61, 0.6); backdrop-filter: blur(14px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
        .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border-radius: 5px; background: rgba(22, 27, 34, 0.8); }
        .day-header { font-size: 0.65rem; font-weight: bold; color: #8b949e; padding-bottom: 3px; }
    </style>
</head>
<body class="p-3 md:p-6 max-w-xl mx-auto pb-24">

    <header class="text-center my-4">
        <h1 class="text-xl font-bold text-amber-400">نظام المهندس آل عكاب الفلكي</h1>
        <p class="text-xs text-gray-400 mt-1">التقويم القمري المتسلسل المبني على حركة عمود السبرنك والكسور الدقيقة</p>
    </header>

    <!-- لوحة المستشعرات الجوية والمناخية -->
    <div class="card p-4 rounded-2xl mb-5 shadow-2xl border-cyan-500/30">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
            <span class="text-xs font-bold text-cyan-400">📡 شبكة المستشعرات الجوية الفلكية</span>
            <span id="sensor-mode" class="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-800">مصحح بالكسور</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">موقع عمود Z (الارتفاع):</span>
                <span id="sensor-z" class="font-bold text-amber-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">الضغط الجوي الفلكي:</span>
                <span id="sensor-pressure" class="font-bold text-sky-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">سرعة واتجاه الرياح:</span>
                <span id="sensor-wind" class="font-bold text-emerald-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">الرطوبة ونسبة التكثف:</span>
                <span id="sensor-humidity" class="font-bold text-indigo-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800 col-span-2">
                <span class="text-gray-400 block text-[10px]">المناخ والطقس الحقيقي:</span>
                <span id="sensor-climate" class="font-bold text-rose-300 text-xs">-</span>
            </div>
        </div>
    </div>

    <!-- حاوية التقويم الشبكي للأشهر الـ 12 المتسلسلة -->
    <div id="calendar-container" class="space-y-4"></div>

    <script>
        // الأسماء القمرية الاثني عشر بالتسلسل الدقيق
        const monthNames = [
            "1. شهر رمضان المبارك",
            "2. شهر شوال",
            "3. شهر ذو القعدة",
            "4. شهر ذو الحجة",
            "5. شهر محرم الحرام",
            "6. شهر صفر",
            "7. شهر ربيع الأول",
            "8. شهر ربيع الثاني",
            "9. شهر جمادى الأولى",
            "10. شهر جمادى الآخرة",
            "11. شهر رجب المرجب",
            "12. شهر شعبان المعظم"
        ];

        // خوارزمية أطوال الأشهر مع ترحيل الكسور الدقيق
        function getMonthData(m) {
            let exactFraction = 0.25;
            if (m === 1) { exactFraction = 0.4625; } 
            else if (m === 2) { exactFraction = 0.375; }
            else if (m === 4) { exactFraction = 0.125; }
            else if (m === 6) { exactFraction = 0.0875; } 
            else if (m >= 10) { exactFraction = 0.40; }

            let totalExactDays = 29 + exactFraction;
            let integerDays = totalExactDays >= 29.35 ? 30 : 29;

            return {
                exact: totalExactDays.toFixed(4),
                days: integerDays
            };
        }

        const weekDays = ["سبت", "أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة"];

        function calculateExactEntries() {
            let entries = [];
            let cumulativeHours = 0;

            for (let i = 1; i <= 12; i++) {
                let mData = getMonthData(i);
                let durationHours = parseFloat(mData.exact) * 24;

                let dayOfMonthIndex = (Math.floor(cumulativeHours / 24) % 30) + 1;
                let hourOfDay = Math.floor(cumulativeHours % 24);
                let minuteOfHour = Math.floor(((cumulativeHours % 24) % 1) * 60);

                entries.push({
                    month: i,
                    exactDuration: mData.exact,
                    integerDays: mData.days,
                    entryString: `اليوم ${dayOfMonthIndex} | الساعة ${hourOfDay.toString().padStart(2,'0')}:${minuteOfHour.toString().padStart(2,'0')}`
                });

                cumulativeHours += durationHours;
            }
            return entries;
        }

        function initApp() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));

            const angle = (dayOfYear / 365.0) * 2 * Math.PI;
            const z = Math.round(50 + 50 * Math.cos(angle));

            document.getElementById('sensor-z').innerText = z + "% (ارتفاع عمود Z)";
            
            let pressure = (1013.25 + (z - 50) * 0.35).toFixed(1) + " hPa";
            let wind = z > 70 ? "شمالية غربية نشطة (28 كم/س)" : (z < 30 ? "جنوبية شرقية هادئة (8 كم/س)" : "متوسطة الاتجاه (15 كم/س)");
            let humidity = Math.min(95, Math.max(15, Math.round(55 + (z - 50) * 0.75))) + "%";
            
            let climateText = "أجواء معتدلة ومستقرة";
            if (z >= 85) {
                climateText = "❄️ برد قارس، كثافة عالية، أمطار وثلوج محتملة";
            } else if (z < 25) {
                climateText = "🔥 حرارة شديدة، جفاف الغلاف، استقرار تام";
            } else if (z > 50) {
                climateText = "🌧️ تكثف سحابي هابط، أمطار موسمية خفيفة";
            } else {
                climateText = "⛅ اعتدال انتقالي، حركة رياح رطبة";
            }

            document.getElementById('sensor-pressure').innerText = pressure;
            document.getElementById('sensor-wind').innerText = wind;
            document.getElementById('sensor-humidity').innerText = humidity;
            document.getElementById('sensor-climate').innerText = climateText;

            const container = document.getElementById('calendar-container');
            const entries = calculateExactEntries();

            for (let i = 1; i <= 12; i++) {
                let monthData = entries[i-1];
                let totalDays = monthData.integerDays;

                let card = document.createElement('div');
                card.className = "card p-3.5 rounded-2xl shadow-xl";

                let headerHtml = `
                    <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-2">
                        <span class="font-bold text-amber-400 text-xs">${monthNames[i-1]}</span>
                        <span class="text-[11px] text-emerald-400 font-mono">المدة: ${monthData.exactDuration} يوم</span>
                    </div>
                    <div class="text-[11px] text-cyan-300 mb-2.5 bg-black/50 p-1.5 rounded-lg border border-cyan-900/40 flex justify-between items-center">
                        <span>⏱️ لحظة الدخول الفلكية الدقيقة:</span>
                        <span class="font-bold text-white">${monthData.entryString}</span>
                    </div>
                `;

                let gridHtml = `<div class="calendar-grid mb-1">`;
                weekDays.forEach(wd => {
                    gridHtml += `<div class="day-header">${wd}</div>`;
                });
                gridHtml += `</div><div class="calendar-grid">`;

                let startOffset = (i * 3) % 7;
                for (let b = 0; b < startOffset; b++) {
                    gridHtml += `<div class="day-cell opacity-10"></div>`;
                }

                for (let d = 1; d <= totalDays; d++) {
                    let isKeyDay = (i === 1 && d === 1) || (i === 2 && d === 1) || (i === 5 && d === 1);
                    let cellStyle = isKeyDay ? "bg-amber-500 text-black font-bold shadow-md" : "bg-gray-800/70 hover:bg-gray-700 text-gray-200";
                    gridHtml += `<div class="day-cell ${cellStyle}">${d}</div>`;
                }

                gridHtml += `</div>`;
                card.innerHTML = headerHtml + gridHtml;
                container.appendChild(card);
            }
        }

        initApp();
    </script>
</body>
</html>
