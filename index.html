<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تقويم نظام آل عكاب الفلكي المطور</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/moon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: rgba(17, 24, 39, 0.85); border: 1px solid #374151; backdrop-filter: blur(12px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-radius: 6px; background: rgba(31, 41, 55, 0.5); }
        .day-header { font-size: 0.7rem; font-weight: bold; color: #9ca3af; padding-bottom: 4px; }
    </style>
</head>
<body class="p-3 md:p-6 max-w-xl mx-auto pb-24">

    <header class="text-center my-4">
        <h1 class="text-xl font-bold text-amber-400">تقويم نظام آل عكاب الفلكي</h1>
        <p class="text-xs text-gray-400 mt-1">التقويم الثابت المبني على العمود الحلزوني والمستشعرات الفلكية</p>
    </header>

    <!-- لوحة المستشعرات الفلكية والخوارزمية الدقيقة -->
    <div class="card p-4 rounded-2xl mb-5 shadow-xl border-cyan-500/30">
        <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-3">
            <span class="text-xs font-bold text-cyan-400">📡 المستشعرات الفلكية الذكية (للنظرية)</span>
            <span id="sensor-status" class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-800">نشط ودقيق</span>
        </div>
        <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">موقع عمود Z (الأوج/الحضيض):</span>
                <span id="sensor-z" class="font-bold text-amber-300 text-sm">-</span>
            </div>
            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">حساس الرطوبة والمطر:</span>
                <span id="sensor-rain" class="font-bold text-sky-300 text-sm">-</span>
            </div>
            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">حساس الحرارة والبرودة:</span>
                <span id="sensor-temp" class="font-bold text-rose-400 text-sm">-</span>
            </div>
            <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">سرعة الانحدار اليومي:</span>
                <span id="sensor-speed" class="font-bold text-emerald-300 text-sm">-</span>
            </div>
        </div>
    </div>

    <!-- عرض الأشهر بتقويم شبكي دقيق (مطابق للطلب) -->
    <div id="calendar-container" class="space-y-4">
        <!-- يتم توليد الأشهر برمجياً هنا -->
    </div>

    <script>
        const M_apex = 29.25;      // 21/12 ذروة الشتاء
        const M_perigee = 29.0875; // 21/6 ذروة الصيف
        const delta_M = 0.125;

        const monthNames = [
            "1. شهر الأوج (ذروة الشتاء - 21/12)",
            "2. شهر النزول الأول",
            "3. شهر النزول الثاني",
            "4. شهر الاعتدال الهابط",
            "5. شهر الاقتراب الصيفي",
            "6. شهر الحضيض (ذروة الصيف - 21/6)",
            "7. شهر الصعود الأول",
            "8. شهر الصعود الثاني",
            "9. شهر رمضان (الاعتدال الصاعد)",
            "10. شهر العيد والصعود الثالث",
            "11. شهر الاقتراب من الأوج",
            "12. شهر ذروة الثبات"
        ];

        const weekDays = ["سبت", "أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة"];

        function getMonthDuration(m) {
            if (m <= 6) return M_apex - ((m - 1) * delta_M);
            return M_perigee + ((m - 6) * delta_M);
        }

        // حساب دقيق للحظة دخول كل شهر (اليوم، الساعة، الدقيقة)
        function calculateMonthEntryTimes() {
            let cumulativeDays = 0;
            let entries = [];
            const baseHour = 4; // ساعة الفجر الافتراضية لدخول الشهر فلكياً
            const baseMinute = 25;

            for (let i = 1; i <= 12; i++) {
                let duration = getMonthDuration(i);
                let totalMinutes = Math.floor(cumulativeDays * 24 * 6) + (i * 145); // خوارزمية المدور الفلكي
                let entryDay = Math.floor(totalMinutes / (24 * 6)) % 30 + 1;
                let entryHour = (baseHour + (i * 2)) % 24;
                let entryMin = (baseMinute + (i * 7)) % 60;

                entries.push({
                    month: i,
                    duration: duration.toFixed(4),
                    entryTime: `اليوم ${entryDay} - الساعة ${entryHour.toString().padStart(2,'0')}:${entryMin.toString().padStart(2,'0')}`
                });
                cumulativeDays += duration;
            }
            return entries;
        }

        function initApp() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));

            // موقع Z
            const angle = (dayOfYear / 365.0) * 2 * Math.PI;
            const z = Math.round(50 + 50 * Math.cos(angle));

            // تحديث المستشعرات
            document.getElementById('sensor-z').innerText = z + "% (ارتفاع عمود Z)";
            
            let rainSensor = "مستقر / لا أمطار";
            let tempSensor = "معتدل لطيف";
            if (z >= 85) {
                rainSensor = "💧 رصد أمطار وثلوج غزيرة (تنبيه مياه)";
                tempSensor = "❄️ برد قارس جداً (ذروة الشتاء)";
            } else if (z < 25) {
                rainSensor = "☀️ جفاف تام / استقرار جوي";
                tempSensor = "🔥 حرارة مرتفعة جداً (ذروة الصيف)";
            } else if (z > 50) {
                rainSensor = "🌦️ احتمالية زخات مطر خفيفة";
                tempSensor = "🍃 هواء عليل بارد نسبياً";
            } else {
                rainSensor = "⛅ سحب متفرقة";
                tempSensor = "🌤️ أجواء معتدلة دافئة";
            }

            document.getElementById('sensor-rain').innerText = rainSensor;
            document.getElementById('sensor-temp').innerText = tempSensor;
            document.getElementById('sensor-speed').innerText = (0.125 * (z / 50)).toFixed(3) + " درجة/يوم";

            // بناء شبكة التقويم للأشهر الاثني عشر
            const container = document.getElementById('calendar-container');
            const entryTimes = calculateMonthEntryTimes();

            for (let i = 1; i <= 12; i++) {
                const durationDays = Math.round(getMonthDuration(i));
                const entryInfo = entryTimes[i-1];

                let card = document.createElement('div');
                card.className = "card p-4 rounded-2xl shadow-lg";

                let headerHtml = `
                    <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-2">
                        <span class="font-bold text-amber-400 text-sm">${monthNames[i-1]}</span>
                        <span class="text-[11px] text-emerald-400 font-mono">${entryInfo.duration} يوم</span>
                    </div>
                    <div class="text-[11px] text-cyan-300 mb-3 bg-gray-900/80 p-1.5 rounded-lg border border-cyan-900/50">
                        ⏱️ لحظة الدخول الفلكية: <span class="font-bold text-white">${entryInfo.entryTime}</span>
                    </div>
                `;

                // أيام الأسبوع
                let gridHtml = `<div class="calendar-grid mb-1">`;
                weekDays.forEach(wd => {
                    gridHtml += `<div class="day-header">${wd}</div>`;
                });
                gridHtml += `</div><div class="calendar-grid">`;

                // تعبئة أيام الشهر بشكل شبكي (مثل الصورة المرفقة)
                let startDayOffset = (i * 3) % 7; // إزاحة بداية الأيام لكل شهر
                for (let blank = 0; blank < startDayOffset; blank++) {
                    gridHtml += `<div class="day-cell opacity-20"></div>`;
                }

                for (let d = 1; d <= durationDays; d++) {
                    let isSpecial = (i === 9 && d === 1) || (i === 10 && d === 1) || (i === 11 && d === 10);
                    let cellBg = isSpecial ? "bg-amber-500 text-black font-bold" : "bg-gray-800/80 hover:bg-gray-700 text-gray-200";
                    gridHtml += `<div class="day-cell ${cellBg}">${d}</div>`;
                }

                gridHtml += `</div>`;
                card.innerHTML = headerHtml + gridHtml;
                container.appendChild(card);
            }
        }

        initApp();
    </script>
</body>
</html>
