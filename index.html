<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك الزمن المطاطي المعيني - التقويم القمري الحي</title>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .month-box {
            background: #1f2937;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-right: 4px solid #38bdf8;
        }
        .month-title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 8px 12px;
            text-align: center;
            border-bottom: 1px solid #374151;
        }
        th {
            background: #111827;
            color: #94a3b8;
        }
        tr.today-row {
            background-color: #0369a1 !important;
            color: #ffffff;
            font-weight: bold;
        }
        .badge {
            background: #f59e0b;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظـام الزّمـن المطاطـي المعينـي</h1>
    <p class="subtitle">التقويم القمري الحي (مبتدئاً برمضان ومنتهياً بشعبان) مع تطبيق فيزياء الأوج والحضيض (47°)</p>
    
    <div id="calendar-container">
        <!-- سيتم توليد التقويم هنا برمجياً -->
    </div>
</div>

<script>
    // هيكل الأشهر القمرية المعينية (يبدأ برمضان وينتهي بشعبان)
    const lunarMonths = [
        { name: "رمضان المبارك", days: 30 },
        { name: "شوال", days: 29 },
        { name: "ذو القعدة", days: 30 },
        { name: "ذو الحجة", days: 29 },
        { name: "محرم", days: 30 },
        { name: "صفر", days: 29 },
        { name: "ربيع الأول", days: 30 },
        { name: "ربيع الثاني", days: 29 },
        { name: "جمادى الأولى", days: 30 },
        { name: "جمادى الآخرة", days: 29 },
        { name: "رجب", days: 30 },
        { name: "شعبان", days: 29 }
    ];

    function calculateFowaqa(dayOfYear) {
        const baseDelta = 10 * Math.sin((23.5 * Math.PI) / 180);
        const angle = (2 * Math.PI * dayOfYear) / 365.2425;
        const fDay = 60.0 - baseDelta * Math.cos(angle);
        const fNight = 60.0 + baseDelta * Math.cos(angle);
        return { fDay: fDay.toFixed(3), fNight: fNight.toFixed(3) };
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        let html = '';
        let dayCounter = 0;
        
        // تاريخ اليوم الحقيقي للمقارنة (محاكاة أو تاريخ نظام الجهاز)
        const todayStr = new Date().toISOString().split('T')[0];

        lunarMonths.forEach((month, mIndex) => {
            html += `<div class="month-box">`;
            html += `<div class="month-title">${mIndex + 1}. شهر ${month.name} (${month.days} يوماً)</div>`;
            html += `<table>`;
            html += `<tr><th>اليوم المعيني</th><th>الفواقة النهارية (F_day)</th><th>الفواقة الليلية (F_night)</th><th>الحالة</th></tr>`;
            
            for (let d = 1; d <= month.days; d++) {
                const fData = calculateFowaqa(dayCounter);
                // محاكاة تطابق تاريخ للتوضيح
                const isToday = (dayCounter === 10); // مثال تجريبي لمؤشر اليوم
                const rowClass = isToday ? 'today-row' : '';
                const badge = isToday ? '<span class="badge">أنت هنا اليوم</span>' : '';

                html += `<tr class="${rowClass}">`;
                html += `<td>اليوم ${d} من ${month.name}</td>`;
                html += `<td>${fData.fDay} لمحة</td>`;
                html += `<td>${fData.fNight} لمحة</td>`;
                html += `<td>${badge}</td>`;
                html += `</tr>`;
                
                dayCounter++;
            }
            html += `</table>`;
            html += `</div>`;
        });

        container.innerHTML = html;
    }

    renderCalendar();
</script>

</body>
</html>
