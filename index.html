<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>التقويم الطبيعي الحي - نظام المهندس آل عكاب</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/moon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #07090e; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: rgba(13, 17, 23, 0.9); border: 1px solid rgba(48, 54, 61, 0.6); backdrop-filter: blur(14px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; border-radius: 6px; background: rgba(22, 27, 34, 0.8); }
        .day-header { font-size: 0.65rem; font-weight: bold; color: #8b949e; padding-bottom: 3px; }
    </style>
</head>
<body class="p-3 md:p-6 max-w-xl mx-auto pb-24">

    <header class="text-center my-4">
        <h1 class="text-xl font-bold text-amber-400">تقويم الزمن الحي والنبض الكوني</h1>
        <p id="system-subtitle" class="text-xs text-emerald-400 mt-1">مرجعية رمضان الشتوي - محوّل المقاييس المعيارية</p>
    </header>

    <!-- لوحة المستشعرات ونظرية الزمن المتغير -->
    <div class="card p-4 rounded-2xl mb-5 shadow-2xl border-cyan-500/30">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
            <span class="text-xs font-bold text-cyan-400">📡 محرك الغلاف الجوي وعمود Z</span>
            <span id="sensor-status" class="text-[10px] bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-800">نبض حي متصل</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">موقع عمود Z (الموسم):</span>
                <span id="val-z" class="font-bold text-amber-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">ساعة النهار الحيّة:</span>
                <span id="val-day-hour" class="font-bold text-sky-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">ساعة الليل الحيّة:</span>
                <span id="val-night-hour" class="font-bold text-indigo-300 text-xs">-</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800">
                <span class="text-gray-400 block text-[10px]">حالة الهلال والبداية:</span>
                <span class="font-bold text-emerald-300 text-xs">مرصود بالعين (ثابت)</span>
            </div>
            <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800 col-span-2">
                <span class="text-gray-400 block text-[10px]">النبض المناخي والموسمي:</span>
                <span id="val-climate" class="font-bold text-rose-300 text-xs">-</span>
            </div>
        </div>
    </div>

    <!-- الأشهر الـ 12 المتباينة مع التواريخ المعيارية المقابلة -->
    <div id="calendar-container" class="space-y-4"></div>

    <script>
        // تسلسل الأشهر مع المرجعية الستينية الشمسية للبداية
        const naturalMonths = [
            { id: 1, name: "1. شهر رمضان المبارك", season: "ذروة الشتاء (مرجعي)", baseDays: 30, standardStart: "22 كانون الأول / ديسمبر" },
            { id: 2, name: "2. شهر شوال", season: "الانتقال الربيعي الأول", baseDays: 30, standardStart: "21 كانون الثاني / يناير" },
            { id: 3, name: "3. شهر ذو القعدة", season: "الانتقال الربيعي المتأخر", baseDays: 30, standardStart: "20 شباط / فبراير" },
            { id: 4, name: "4. شهر ذو الحجة", season: "بداية الصيف والمناسك", baseDays: 31, standardStart: "22 آذار / مارس" },
            { id: 5, name: "5. شهر محرم الحرام", season: "ذروة الصيف والحرارة", baseDays: 31, standardStart: "22 نيسان / أبريل" },
            { id: 6, name: "6. شهر صفر", season: "ذروة الصيف المطمط", baseDays: 31, standardStart: "23 أيار / مايو" },
            { id: 7, name: "7. شهر ربيع الأول", season: "بداية الاعتدال الخريفي", baseDays: 30, standardStart: "23 حزيران / يونيو" },
            { id: 8, name: "8. شهر ربيع الثاني", season: "الخريف المنتظم", baseDays: 30, standardStart: "23 تموز / تموز" },
            { id: 9, name: "9. شهر جمادى الأولى", season: "مقدمات البرد الشتوي", baseDays: 30, standardStart: "22 آب / أغسطس" },
            { id: 10, name: "10. شهر جمادى الآخرة", season: "الدخول في الشتاء", baseDays: 30, standardStart: "21 أيلول / سبتمبر" },
            { id: 11, name: "11. شهر رجب المرجب", season: "عمق الشتاء والكثافة", baseDays: 30, standardStart: "21 تشرين الأول / أكتوبر" },
            { id: 12, name: "12. شهر شعبان المعظم", season: "الاستعداد لرمضان", baseDays: 30, standardStart: "20 تشرين الثاني / نوفمبر" }
        ];

        const weekDays = ["سبت", "أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة"];

        function initNaturalCalendar() {
            const now = new Date();
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));

            // حساب موقع عمود Z
            const zAngle = (dayOfYear / 365.2422) * 2 * Math.PI;
            const zValue = Math.round(50 + 50 * Math.cos(zAngle));

            let dayHourMin = (60 - 10 * (zValue / 50)).toFixed(1);
            let nightHourMin = (60 + 10 * (zValue / 50)).toFixed(1);

            document.getElementById('val-z').innerText = zValue + "% (عمود Z)";
            document.getElementById('val-day-hour').innerText = dayHourMin + " دقيقة للساعة";
            document.getElementById('val-night-hour').innerText = nightHourMin + " دقيقة للساعة";

            let climateStr = zValue >= 75 ? "❄️ شتاء قارس: انكماش زمني، نهار قصير، كثافة عالية" :
                             (zValue <= 25 ? "🔥 صيف لاهب: تمدد زمني، نهار طويل جداً، مطمطاة ثقيلة" : "⛅ اعتدال موسمي انتقالي متوازن");
            document.getElementById('val-climate').innerText = climateStr;

            const container = document.getElementById('calendar-container');
            container.innerHTML = "";

            naturalMonths.forEach(m => {
                let card = document.createElement('div');
                card.className = "card p-3.5 rounded-2xl shadow-xl";

                let headerHtml = `
                    <div class="flex justify-between items-center mb-1 border-b border-gray-800 pb-2">
                        <span class="font-bold text-amber-400 text-xs">${m.name}</span>
                        <span class="text-[10px] text-cyan-300 font-mono">${m.season}</span>
                    </div>
                    <div class="bg-black/60 p-2 rounded-lg border border-gray-800/80 mb-2 flex justify-between items-center text-[10px]">
                        <span class="text-gray-400">📏 بداية الشهر بالمقياس الستيني المعياري:</span>
                        <span class="font-bold text-emerald-300 font-mono">${m.standardStart}</span>
                    </div>
                    <div class="text-[10px] text-emerald-400 mb-2 flex justify-between">
                        <span>🌙 رؤية الهلال: مطابقة ومثبتة</span>
                        <span class="font-bold text-amber-300">المدة الحية: ${m.baseDays} يوماً</span>
                    </div>
                `;

                let gridHtml = `<div class="calendar-grid mb-1">`;
                weekDays.forEach(wd => {
                    gridHtml += `<div class="day-header">${wd}</div>`;
                });
                gridHtml += `</div><div class="calendar-grid">`;

                let offset = (m.id * 3) % 7;
                for (let b = 0; b < offset; b++) {
                    gridHtml += `<div class="day-cell opacity-10"></div>`;
                }

                for (let d = 1; d <= m.baseDays; d++) {
                    let isFirstDay = (d === 1);
                    let cellClass = isFirstDay ? "bg-amber-500 text-black font-bold shadow" : "bg-gray-800/70 text-gray-200 hover:bg-gray-700";
                    gridHtml += `
                        <div class="day-cell ${cellClass}">
                            <span>${d}</span>
                            ${isFirstDay ? '<span class="text-[8px] opacity-80">هلال</span>' : ''}
                        </div>
                    `;
                }

                gridHtml += `</div>`;
                card.innerHTML = headerHtml + gridHtml;
                container.appendChild(card);
            });
        }

        initNaturalCalendar();
    </script>
</body>
</html>
